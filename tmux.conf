# ==========================================================
# tmux 設定 — 「見えない裏方」
# 役割: ws がプロジェクトごとに 1 セッションを保持するためだけに使う。
# 画面分割・移動・Claude Code はすべて Neovim 内で行う（ADR-0003）。
# ステータスバーの色は ws がセッション単位で上書きする（status-style）。
# ==========================================================

# ── 端末・色 ─────────────────────────────
# True color (24-bit) サポート
set -g default-terminal "tmux-256color"
# Terminal.app（xterm-256color）でも 24-bit 色を通す
set -ag terminal-overrides ",xterm-256color:RGB"
# Ghostty: 24-bit 色・拡張キー・クリップボード(OSC 52)・下線色などを有効化
set -as terminal-features ",xterm-ghostty:RGB:extkeys:clipboard:ccolour:cstyle:focus:strikethrough:usstyle"

# ── Neovim との相性 ─────────────────────────
# Esc 後の待ち時間をなくす（nvim で Insert → Normal が遅れるのを防ぐ）
set -s escape-time 0
# FocusGained/FocusLost を nvim に渡す（autoread による自動リロードが依存）
set -g focus-events on
# 拡張キー（CSI u）を有効化。<C-i>/<Tab> などを nvim が区別できる（対応端末のみ）
set -s extended-keys on
# nvim の OSC 52 ヤンクを外側の端末のクリップボードへ流す
set -s set-clipboard on

# ── 画像表示（snacks.nvim image / kitty graphics protocol）──
# エスケープシーケンスを外側の端末（Ghostty）へ素通しする
set -g allow-passthrough on
# attach し直した端末の TERM / TERM_PROGRAM をセッション環境へ反映
# （snacks.nvim が画像プロトコル対応端末かを判定するのに使う）
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ── 操作性 ─────────────────────────────
# マウス有効（スクロール・選択）
set -g mouse on
# スクロールバックを多めに保持
set -g history-limit 50000
# ウィンドウ番号を 1 から振る（キーボードの並びと一致）
set -g base-index 1
setw -g pane-base-index 1
# ウィンドウを閉じたら番号を詰める
set -g renumber-windows on

# ── ステータスバー（最小限）────────────────────
# 上に置く（下は Neovim のステータスラインと重なるため）
set -g status-position top
# 既定色。ws がセッションごとに status-style を上書きする
set -g status-style "bg=#1a1b26,fg=#c0caf5"
# 左: プロジェクト名（ws が付ける @ws_label。無ければセッション名。セッション名は api-1a2b のようにハッシュ付き）
set -g status-left "#[bold] #{?@ws_label,#{@ws_label},#S} #[nobold]"
set -g status-left-length 40
# 右: 時刻だけ
set -g status-right " %H:%M "
set -g status-right-length 20
# ウィンドウ一覧は使わない前提なので控えめに
setw -g window-status-format " #I "
setw -g window-status-current-format "#[bold] #I "
